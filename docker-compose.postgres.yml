services:
  db:
    image: postgres:16-alpine
    container_name: plant-reminder-db
    restart: always
    environment:
      POSTGRES_DB: plant_reminder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_reminder"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
